  <title>Advisory Board Unlimited — kvadratisk mærke, ab | u (lille skala)</title>
  <desc>Optisk korrigeret udgave af mærke 01 til lille gengivelse (favicon, app-ikon, 32–96 px). Open Sans SemiBold i outline, guldpipe #B4965D forstærket til 16 enheder, og motivet skaleret til 85 % af kvadratets bredde, så både bogstavstreger og pipe holder mindst 1 px ved 32 px. Navy bogstaver #263753 til lyse flader. Transparent baggrund.</desc>
